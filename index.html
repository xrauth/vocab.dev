<style>

const $=s=>document.querySelector(s),sT=$('#tr'),sM=$('#mn'),inn=$('#in'),faces=inn.children,kb=$('#kb');

const LOCAL_IDS=[];
["98|Haus (substantiv n)|house (noun)|casa (sustantivo f)|casa (substantivo f)", "96|Wasser (substantiv n)|water (noun)|agua (sustantivo f)|água (substantivo f)", "95|Zeit (substantiv f)|time (noun)|tiempo (sustantivo m)|tempo (substantivo m)", "94|Mann (substantiv m)|man (noun)|hombre (sustantivo m)|homem (substantivo m)", "94|Frau (substantiv f)|woman (noun)|mujer (sustantivo f)|mulher (substantivo f)", "93|Hund (substantiv m)|dog (noun)|perro (sustantivo m)|cachorro (substantivo m)", "92|Buch (substantiv n)|book (noun)|libro (sustantivo m)|livro (substantivo m)", "91|Tag (substantiv m)|day (noun)|día (sustantivo m)|dia (substantivo m)", "90|Freund (substantiv m)|friend (noun)|amigo (sustantivo m)|amigo (substantivo m)", "89|Stadt (substantiv f)|city (noun)|ciudad (sustantivo f)|cidade (substantivo f)", "88|gehen (verb)|go (verb)|ir (verbo)|ir (verbo)", "87|essen (verb)|eat (verb)|comer (verbo)|comer (verbo)", "86|groß (adjektiv)|big (adjective)|grande (adjetivo)|grande (adjetivo)", "85|schön (adjektiv)|beautiful (adjective)|hermoso (adjetivo)|bonito (adjetivo)", "84|Brot (substantiv n)|bread (noun)|pan (sustantivo m)|pão (substantivo m)", "83|Kind (substantiv n)|child (noun)|niño (sustantivo m)|criança (substantivo f)", "82|Straße (substantiv f)|street (noun)|calle (sustantivo f)|rua (substantivo f)", "80|schlafen (verb)|sleep (verb)|dormir (verbo)|dormir (verbo)", "79|Katze (substantiv f)|cat (noun)|gato (sustantivo m)|gato (substantivo m)", "78|lesen (verb)|read (verb)|leer (verbo)|ler (verbo)"].forEach(l=>{const c=l.split('|'),d=cell(c[1]);addW({id:d.w,f:+c[0],w:{de:d,en:cell(c[2]),es:cell(c[3]),pt:cell(c[4])}});LOCAL_IDS.push(d.w)});
WORDS.__start={id:'__start',f:100,de:cell('starten (verb)'),en:cell('start (verb)'),es:cell('iniciar (verbo)'),pt:cell('iniciar (verbo)')};

function applyLang(){const t=TX[cfg.mn];$('#lw').textContent=t.wd;$('#sct').textContent=t.sc;$('#user').title=t.tip}
function tween(key,el,to){
  to=Math.round(to);const from=shown[key];cancelAnimationFrame(anim[key]);
  if(from==null||from===to){shown[key]=to;el.textContent=to;return}
  const d=Math.min(1400,350+Math.abs(to-from)*4),t0=performance.now(),e=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const f=now=>{const p=Math.min(1,(now-t0)/d),v=Math.round(from+(to-from)*e(p));shown[key]=v;el.textContent=v;if(p<1)anim[key]=requestAnimationFrame(f)};
  anim[key]=requestAnimationFrame(f);
}
const draw=()=>{tween('s',$('#score'),S.score);tween('c',$('#cnt'),S.count)};
function flash(c){const f=faces[face];f.classList.add(c);setTimeout(()=>f.classList.remove(c),1100)}

/* pronúncia: cb é chamado quando a fala termina */
function say(txt,lg,cb){
  let ended=false;const fin=()=>{if(!ended){ended=true;cb&&cb()}};
  if(!('speechSynthesis' in window)){cb&&setTimeout(fin,600);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt),L=VL[lg],vs=speechSynthesis.getVoices();
  u.lang=L;u.rate=.9;
  const v=vs.find(v=>v.lang.replace('_','-')===L)||vs.find(v=>v.lang.slice(0,2)===lg);if(v)u.voice=v;
  u.onend=u.onerror=fin;if(cb)setTimeout(fin,7000);
  speechSynthesis.speak(u);
}

/* ---------- servidor (visitantes e logados recebem palavras do banco) ---------- */
async function ensure(ids){
  const m=ids.filter(i=>!WORDS[i]);if(!m.length)return;
  const{data,error}=await sb.rpc('words_by_id',{p_ids:m});if(error)throw error;data.forEach(addW);
}
async function refill(){
  const ex=[...buf,...(cur&&cur!=='__start'?[cur]:[]),...(user?[...dirty]:Object.keys(S.w))];
  const{data,error}=await sb.rpc('new_words',{p_pair:pair(),p_lv:S.lv,p_n:5,p_exclude:ex});
  if(error)throw error;
  if(!data.length)hold=Date.now()+60000; // cota diária esgotada: não insistir por 1 min
  data.forEach(r=>{addW(r);if(!S.w[r.id]&&!buf.includes(r.id))buf.push(r.id)});saveBuf();
}
let fp=null,hold=0;
const prefetch=()=>Date.now()<hold?Promise.resolve():fp||(fp=refill().catch(()=>{}).finally(()=>{fp=null}));
const saveBuf=()=>{try{localStorage.setItem('wp3buf',JSON.stringify(buf.map(i=>WORDS[i]).filter(Boolean)))}catch(e){}};
const warm=()=>{
  const ids=Object.keys(S.w).filter(k=>!WORDS[k]).sort((a,b)=>S.w[a].due-S.w[b].due).slice(0,10);
  if(ids.length)wp=ensure(ids).catch(()=>{}).then(()=>{wp=null});
};
async function flush(){
  if(fl)await fl;
  if(!user||!navigator.onLine||(!dirty.size&&!dirtyS))return;
  const ids=[...dirty],p=pair(),ds=dirtyS,uid=user.id,Sn=S;
  dirty=new Set();dirtyS=false;
  fl=(async()=>{
    try{
      if(ids.length){const{error}=await sb.from('progress').upsert(ids.map(i=>({user_id:uid,pair:p,word_id:i,due:Sn.w[i].due,iv:Sn.w[i].iv,k:Sn.w[i].k})),{onConflict:'user_id,pair,word_id'});if(error)throw error}
      if(ds){const{error}=await sb.from('state').upsert({user_id:uid,pair:p,score:Sn.score,known:Sn.count,turn:Sn.turn,games:Sn.games,lv:Sn.lv},{onConflict:'user_id,pair'});if(error)throw error}
    }catch(e){ids.forEach(i=>dirty.add(i));dirtyS=dirtyS||ds}
    fl=null;
  })();
  await fl;
}
async function all(t,cols,p){
  let o=0,r=[];
  for(;;){const{data,error}=await sb.from(t).select(cols).eq('user_id',user.id).eq('pair',p).range(o,o+999);if(error)throw error;r=r.concat(data);if(data.length<1000)return r;o+=1000}
}
async function syncServer(reset){
  const p=pair(),pend=snap(lk()),G=reset?null:S;
  const[pr,st]=await Promise.all([all('progress','word_id,due,iv,k',p),all('state','score,known,turn,games,lv',p)]),s=st[0];
  const B=s?{score:s.score,count:s.known,turn:s.turn,games:s.games,lv:s.lv}:(G||fresh());
  const N={score:B.score,count:B.count,turn:B.turn,games:B.games,lv:B.lv,w:{}},nd=new Set();let nds=!s&&!!G;
  pr.forEach(r=>N.w[r.word_id]={due:r.due,iv:r.iv,k:r.k});

  if(pend){if(pend.ds){Object.assign(N,pend.S,{w:N.w});nds=true}(pend.d||[]).forEach(i=>{if(pend.S.w[i]){N.w[i]=pend.S.w[i];nd.add(i)}})}
  try{localStorage.removeItem('wp3:g:'+p)}catch(e){}
  S=N;dirty=nd;dirtyS=nds;draw();local();flush();warm();
  if(reset)begin(true);
}

/* ---------- jogo ---------- */
/* m: 'x' exposição | 'w' digitar a palavra | 't' digitar a tradução */
function fill(f,row,m){
  const a=row[cfg.mn],b=row[cfg.tr],al=[...a.w].length,bl=[...b.w].length;
  f.innerHTML='<div class="w'+(m==='w'?' m':'')+'"></div><div class="p"></div><i class="hr"></i><div class="t'+(m==='t'?' m':'')+'"></div>'+(m==='x'?'<button class="sp" aria-label="ouvir">'+SP+'</button>':'');
  const[w,p,,t]=f.children;
  w.textContent=m==='w'?' '.repeat(al):a.w;
  w.style.fontSize=`calc(${Math.min(12.5,50/(al*(m==='w'?.62:.54)))} * var(--u))`;
  p.textContent=a.p+(a.g?` (${a.g})`:'');
  t.textContent=m==='t'?' '.repeat(bl):b.w;
  if(m==='t')t.style.fontSize=`calc(${Math.min(5.4,50/(bl*.62))} * var(--u))`;
}
function clearKb(){kb.querySelectorAll('.k').forEach(k=>{k.classList.remove('on','hint');k.style.transitionDelay='0s'});setTimeout(()=>{if(busy)kb.innerHTML=''},400)}
function present(id,first){
  cur=id;mode=(id!=='__start'&&S.w[id])?'w':'x';lock=false;errs=0;busy=true;clearKb();
  const row=WORDS[id];
  setTimeout(()=>{if(cur===id&&mode==='x')say(row[cfg.mn].w,cfg.mn)},first?150:400);
  if(first){fill(faces[face],row,mode);setTimeout(ready,50);return}
  face^=1;fill(faces[face],row,mode);angle+=180;inn.style.transform=`rotateY(${angle}deg)`;
  setTimeout(ready,760);
}
function ready(){busy=false;if(mode!=='x')typing()}
function begin(flip){cur=null;applyLang();draw();present('__start',!flip);prefetch();warm()}
const nearBuf=()=>{
  buf=buf.filter(i=>!S.w[i]&&i!==cur&&has(WORDS[i]));let b=null;const d=i=>Math.abs(WORDS[i].f-S.lv);
  for(const i of buf)if(b===null||d(i)<d(b)||(d(i)===d(b)&&WORDS[i].f>WORDS[b].f))b=i;
  return b;
};
const pickNew=()=>{
  const b=nearBuf();if(b!==null)return b;
  const lc=LOCAL_IDS.filter(i=>!S.w[i]&&i!==cur);   // banco indisponível: palavra local aleatória
  return lc.length?lc[Math.random()*lc.length|0]:null;
};
async function next(){
  busy=true;if(wp)await wp;
  const t=S.turn+1,ok=k=>k!==cur&&has(WORDS[k]);
  let id=null,md=1e9;
  for(const k in S.w)if(ok(k)&&S.w[k].due<=t&&S.w[k].due<md){md=S.w[k].due;id=k}
  if(!id){const b=nearBuf();if(b===null||Math.abs(WORDS[b].f-S.lv)>12)await Promise.race([prefetch(),new Promise(r=>setTimeout(r,900))]);else if(buf.length<2)prefetch();id=pickNew()}
  if(!id){md=1e9;for(const k in S.w)if(ok(k)&&S.w[k].due<md){md=S.w[k].due;id=k}}
  if(!id)id=LOCAL_IDS[0];
  S.turn=t;dirtyS=true;local();present(id,false);warm();saveBuf();
}
function typing(){lang=mode==='w'?cfg.mn:cfg.tr;chars=[...WORDS[cur][lang].w];exp=0;errs=0;lock=false;keys()}
/* uma linha de 5 teclas por letra: a correta + 4 distratoras */
function keys(){
  const x=chars[exp].toLowerCase(),pool=ALPHA[lang],nx=x.normalize('NFD')[0],nt=(chars[exp+1]||'').toLowerCase(),set=new Set([x]);
  const near=[...pool].filter(c=>c!==x&&c!==nt&&c.normalize('NFD')[0]===nx);
  if(near.length&&Math.random()<.6)set.add(near[Math.random()*near.length|0]);
  if(nx!==x&&nx!==nt&&/[a-z]/.test(nx)&&set.size<3&&Math.random()<.6)set.add(nx);
  for(let g=0;set.size<3&&g<300;g++){const c=pool[Math.floor(Math.pow(Math.random(),1.5)*pool.length)];if(c!==nt)set.add(c)}
  kb.innerHTML='';const r=document.createElement('div');r.className='row';
  shuf([...set]).forEach((c,i)=>{const b=document.createElement('button');b.className='k';b.textContent=c;b.dataset.c=c;b.style.transitionDelay=(i*30)+'ms';b.onclick=()=>press(b);r.appendChild(b)});
  kb.appendChild(r);
  requestAnimationFrame(()=>requestAnimationFrame(()=>kb.querySelectorAll('.k').forEach(k=>k.classList.add('on'))));
}
function press(b){
  if(busy||lock||b.dataset.u)return;
  const x=chars[exp].toLowerCase();
  b.dataset.u=1;b.style.transitionDelay='0s';b.classList.remove('on');b.style.pointerEvents='none';
  if(b.dataset.c!==x){ // erro: pune uma única vez, revela a certa, e segue letra a letra
    if(!errs){errs=1;result(false)}
    flash('bad');
    kb.querySelectorAll('.k').forEach(k=>{if(k.dataset.c===x)k.classList.add('hint')});
    return;
  }
  exp++;faces[face].children[mode==='w'?0:3].textContent=chars.map((c,i)=>i<exp?c:' ').join('');
  lock=true;kb.querySelectorAll('.k').forEach(k=>{k.style.transition='opacity .16s';k.style.transitionDelay='0s';k.classList.remove('on','hint')});
  if(exp===chars.length){
    busy=true;if(!errs){result(true);flash('ok')}
    setTimeout(next,1500);
    return;
  }
  setTimeout(()=>{lock=false;keys()},160);
}
function result(ok){
  const row=WORDS[cur],D=800+(100-row.f)*12+(chars.length-5)*20;
  const E=1/(1+Math.pow(10,(D-S.score)/400)),K=32*Math.max(.3,1-S.games/200);
  S.score=Math.max(0,S.score+(ok?K*(1-E):-1.5*K*E));S.games++;
  const w=S.w[cur];
  if(ok){w.iv=Math.ceil(w.iv*2.5);if(!w.k){w.k=1;S.count++}}else{w.iv=Math.max(2,Math.floor(w.iv/3));if(w.k){w.k=0;S.count--}}
  w.due=S.turn+w.iv;S.st=ok?(S.st||0)+1:0;S.lv=Math.min(100,Math.max(10,S.lv+(ok?-(4+2*Math.min(S.st,5)):6)));
  dirty.add(cur);dirtyS=true;local();setTimeout(flush,300);draw();
}
const tap=e=>{
  if(e.target.closest('.sp')){if(mode==='x')say(WORDS[cur][cfg.mn].w,cfg.mn);return}
  if(busy||mode!=='x')return;
  if(cur!=='__start'&&!S.w[cur]){S.w[cur]={iv:3,due:S.turn+3,k:0};dirty.add(cur);dirtyS=true;local()}
  busy=true;next();
};
faces[0].onclick=faces[1].onclick=tap;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(mode==='x'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tap({target:document.body});return}
  if(e.key.length===1){const t=[...kb.querySelectorAll('.k')].find(k=>!k.dataset.u&&k.dataset.c===e.key.toLowerCase());if(t)press(t)}
});

/* ---------- idiomas, login (opcional), sincronização ---------- */
function toGuest(){S=guestS();dirty=new Set();dirtyS=false;begin(true)}
async function setPair(tr,mn){
  busy=true;await flush();local();
  cfg={tr,mn};sT.value=tr;sM.value=mn;
  try{localStorage.setItem('wp3cfg',JSON.stringify(cfg))}catch(e){}
  if(user)syncServer(true).catch(()=>{S=snap(lk())?.S||fresh();begin(true)});else toGuest();
}
sT.onchange=()=>setPair(sT.value,sT.value===cfg.mn?cfg.tr:cfg.mn);
sM.onchange=()=>setPair(sM.value===cfg.tr?cfg.mn:cfg.tr,sM.value);
$('#sw').onclick=()=>setPair(cfg.mn,cfg.tr);
function ui(){
  const m=user?.user_metadata||{},nm=(m.full_name||m.name||user?.email||'').split(/[\s@]/)[0],a=$('#av'),pic=m.avatar_url||m.picture;
  $('#un').textContent=user?nm:'Login';
  if(user&&pic){a.src=pic;a.style.display='block'}else{a.removeAttribute('src');a.style.display='none'}
}
$('#user').onclick=async()=>{
  if(!user)return sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(confirm(TX[cfg.mn].out)){await flush();await sb.auth.signOut()}
};
sb.auth.onAuthStateChange((ev,ses)=>{
  const u=ses?.user||null;if(u?.id===user?.id)return;
  user=u;ui();
  if(u)syncServer(false).catch(console.error);else toGuest();
});
setInterval(flush,15000);
addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
try{buf=(JSON.parse(localStorage.getItem('wp3buf'))||[]).map(r=>{WORDS[r.id]=r;return r.id})}catch(e){}
S=guestS();begin(false);
</script>
